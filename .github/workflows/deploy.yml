name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudrun-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY_LOCATION: asia-south1
  REGISTRY_REPOSITORY: slidesage
  RUN_REGION: asia-south1
  IMAGE_VERSION: ${{ github.sha }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_api_image: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/slidesage/api:${{ github.sha }}
  TF_VAR_worker_image: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/slidesage/worker:${{ github.sha }}
  TF_VAR_migrate_image: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/slidesage/migrate:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY_LOCATION-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/api:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/api:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/worker:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/worker:latest

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/migrate:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/migrate:latest

  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/prod
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=prod"

      - name: Update migration job definition
        working-directory: infra/prod
        run: terraform apply -input=false -auto-approve -target=google_cloud_run_v2_job.migrate

      - name: Run migrations
        run: gcloud run jobs execute slidesage-migrate --project=$PROJECT_ID --region=$RUN_REGION --wait

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/prod
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=prod"

      - name: Terraform apply
        working-directory: infra/prod
        run: terraform apply -input=false -auto-approve

      - name: Verify Cloud Run exposure
        run: |
          API_INGRESS=$(gcloud run services describe api \
            --project=$PROJECT_ID \
            --region=$RUN_REGION \
            --format="value(metadata.annotations.'run.googleapis.com/ingress')")
          WORKER_INGRESS=$(gcloud run services describe worker \
            --project=$PROJECT_ID \
            --region=$RUN_REGION \
            --format="value(metadata.annotations.'run.googleapis.com/ingress')")
          WORKER_PUBLIC_BINDING=$(gcloud run services get-iam-policy worker \
            --project=$PROJECT_ID \
            --region=$RUN_REGION \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')

          test "$API_INGRESS" = internal-and-cloud-load-balancing
          test "$WORKER_INGRESS" = internal
          test -z "$WORKER_PUBLIC_BINDING"
