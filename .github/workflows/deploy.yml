name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudrun-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY_LOCATION: asia-south1
  REGISTRY_REPOSITORY: slidesage
  RUN_REGION: asia-south1
  IMAGE_VERSION: ${{ github.sha }}
  API_AUTH_FLAG: ${{ vars.API_AUTH_FLAG || '--allow-unauthenticated' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY_LOCATION-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/api:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/api:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/worker:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/worker:latest

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/migrate:${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPOSITORY }}/migrate:latest

  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy and run migrations
        run: |
          IMAGE=$REGISTRY_LOCATION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPOSITORY/migrate:$IMAGE_VERSION
          gcloud run jobs deploy slidesage-migrate \
            --image=$IMAGE \
            --region=$RUN_REGION \
            --service-account=slidesage-runtime@$PROJECT_ID.iam.gserviceaccount.com \
            --add-cloudsql-instances=$PROJECT_ID:$RUN_REGION:slidesage-postgres \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --execute-now \
            --wait

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API service
        run: |
          IMAGE=$REGISTRY_LOCATION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPOSITORY/api:$IMAGE_VERSION
          gcloud run deploy api \
            $API_AUTH_FLAG \
            --image=$IMAGE \
            --region=$RUN_REGION \
            --ingress=internal-and-cloud-load-balancing \
            --service-account=slidesage-runtime@$PROJECT_ID.iam.gserviceaccount.com \
            --add-cloudsql-instances=$PROJECT_ID:$RUN_REGION:slidesage-postgres \
            --port=8000 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=300s \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,RATE_LIMIT_HASH_SECRET=RATE_LIMIT_HASH_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,EXA_API_KEY=EXA_API_KEY:latest,OPEN_ROUTER_API_KEY=OPEN_ROUTER_API_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM_EMAIL=RESEND_FROM_EMAIL:latest \
            --set-env-vars='^@^NODE_ENV=production@BASE_URL=https://api.slidesage.app@CORS_ORIGINS=https://slidesage.app,https://www.slidesage.app,https://slidesage.pages.dev,https://slide-sage.pages.dev@BETTER_AUTH_TRUSTED_ORIGINS=https://slidesage.app,https://www.slidesage.app,https://slidesage.pages.dev,https://slide-sage.pages.dev@OPEN_ROUTER_MODEL=google/gemma-4-26b-a4b-it:free@OPEN_ROUTER_API_BASE=https://openrouter.ai/api/v1/chat/completions'

      - name: Deploy worker service
        run: |
          IMAGE=$REGISTRY_LOCATION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPOSITORY/worker:$IMAGE_VERSION
          gcloud run deploy worker \
            --no-allow-unauthenticated \
            --image=$IMAGE \
            --region=$RUN_REGION \
            --ingress=internal \
            --service-account=slidesage-runtime@$PROJECT_ID.iam.gserviceaccount.com \
            --add-cloudsql-instances=$PROJECT_ID:$RUN_REGION:slidesage-postgres \
            --port=8080 \
            --cpu=1 \
            --memory=1Gi \
            --no-cpu-throttling \
            --min-instances=1 \
            --max-instances=1 \
            --concurrency=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,OPEN_ROUTER_API_KEY=OPEN_ROUTER_API_KEY:latest \
            --set-env-vars='^@^NODE_ENV=production@WORKER_CONCURRENCY=2@BASE_URL=https://api.slidesage.app@OPEN_ROUTER_MODEL=google/gemma-4-26b-a4b-it:free@OPEN_ROUTER_API_BASE=https://openrouter.ai/api/v1/chat/completions'

      - name: Verify Cloud Run exposure
        run: |
          API_INGRESS=$(gcloud run services describe api \
            --project=$PROJECT_ID \
            --region=$RUN_REGION \
            --format="value(metadata.annotations.'run.googleapis.com/ingress')")
          WORKER_INGRESS=$(gcloud run services describe worker \
            --project=$PROJECT_ID \
            --region=$RUN_REGION \
            --format="value(metadata.annotations.'run.googleapis.com/ingress')")
          WORKER_PUBLIC_BINDING=$(gcloud run services get-iam-policy worker \
            --project=$PROJECT_ID \
            --region=$RUN_REGION \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')

          test "$API_INGRESS" = internal-and-cloud-load-balancing
          test "$WORKER_INGRESS" = internal
          test -z "$WORKER_PUBLIC_BINDING"
