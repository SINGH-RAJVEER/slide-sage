name: Production infrastructure plan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.DATADOG_OTLP_ENDPOINT }}
      TF_VAR_otel_logs_exporter: ${{ vars.OTEL_LOGS_EXPORTER || 'otlp' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Use deployed images for a read-only infrastructure plan
        shell: bash
        run: |
          set -euo pipefail
          for component in api worker; do
            image=$(gcloud run services describe "$component" \
              --project="$TF_VAR_gcp_project_id" --region=asia-south1 \
              --format='value(spec.template.spec.containers[0].image)')
            test -n "$image"
            echo "TF_VAR_${component}_image=$image" >> "$GITHUB_ENV"
            if [ "$component" = worker ]; then
              # The first release creates this service. Planning checks the
              # resource configuration; deployment supplies its built image.
              echo "TF_VAR_preview_image=$image" >> "$GITHUB_ENV"
            fi
          done
          image=$(gcloud run jobs describe slidesage-migrate \
            --project="$TF_VAR_gcp_project_id" --region=asia-south1 \
            --format='value(spec.template.spec.template.spec.containers[0].image)')
          test -n "$image"
          echo "TF_VAR_migrate_image=$image" >> "$GITHUB_ENV"
      - name: Validate and plan with the deployment identity
        working-directory: infra/prod
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config=prefix=prod
          terraform validate -no-color
          terraform plan -input=false -lock-timeout=5m -no-color
