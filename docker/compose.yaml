name: slidesage

services:
    postgres:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-slidesage}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidesage}
            POSTGRES_DB: ${POSTGRES_DB:-slidesage}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        shm_size: 256mb
        stop_grace_period: 30s
        networks:
            - backend

    migrate:
        image: slidesage-migration:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/api.Dockerfile
            target: migration
        env_file:
            - ../.env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-slidesage}:${POSTGRES_PASSWORD:-slidesage}@postgres:5432/${POSTGRES_DB:-slidesage}
            NODE_ENV: production
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        security_opt:
            - no-new-privileges:true
        networks:
            - backend

    api:
        image: slidesage-api:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/api.Dockerfile
            target: api
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-slidesage}:${POSTGRES_PASSWORD:-slidesage}@postgres:5432/${POSTGRES_DB:-slidesage}
            NODE_ENV: production
            PORT: 8000
        depends_on:
            migrate:
                condition: service_completed_successfully
        expose:
            - "8000"
        init: true
        read_only: true
        tmpfs:
            - /tmp:size=64m,mode=1777
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - "const response = await fetch('http://127.0.0.1:8000/'); process.exit(response.ok ? 0 : 1)"
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        stop_grace_period: 30s
        networks:
            - backend

    nginx:
        image: slidesage-nginx:${IMAGE_TAG:-latest}
        build:
            context: ..
            dockerfile: docker/nginx.Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-}
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "${HTTP_PORT:-80}:8080"
        init: true
        read_only: true
        tmpfs:
            - /tmp:size=64m,mode=1777
        security_opt:
            - no-new-privileges:true
        stop_grace_period: 30s
        networks:
            - backend

volumes:
    postgres-data:

networks:
    backend:
