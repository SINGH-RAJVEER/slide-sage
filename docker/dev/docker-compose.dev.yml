# Development Docker Compose

services:
  litellm:
    build:
      context: ../..
      dockerfile: docker/dev/litellm.Dockerfile
    image: slide-sage/litellm:dev
    container_name: slide-sage-litellm-dev
    ports:
      - "4000:4000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../../litellm_config.yaml:/app/litellm_config.yaml:ro
    restart: "no"
    networks:
      - slide-sage-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database:
    image: pgvector/pgvector:pg17
    container_name: slide-sage-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slidesage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidesage}
      POSTGRES_DB: ${POSTGRES_DB:-slidesage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-slidesage} -d ${POSTGRES_DB:-slidesage}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slide-sage-network

  apis:
    build:
      context: ../..
      dockerfile: docker/dev/backend.Dockerfile
      target: development
      args:
        NODE_ENV: development
    image: slide-sage/apis:dev
    container_name: slide-sage-apis-dev
    ports:
      - "${APIS_PORT:-8000}:8000"
    restart: "no"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      BASE_URL: "http://localhost:8000"
      CORS_ORIGIN: "http://localhost:5173"
      DATABASE_URL: postgresql://${POSTGRES_USER:-slidesage}:${POSTGRES_PASSWORD:-slidesage}@database:5432/${POSTGRES_DB:-slidesage}
      LITELLM_PROXY_BASE: http://litellm:4000
      LITELLM_SEARCH_MODEL: ${LITELLM_SEARCH_MODEL:-llama-3.1-8b-instant}
      ROOT_DIR: /app
      BUN_CACHE_DIR: /root/.bun/install/cache
      STAMP_DIR: /app/.docker-cache/apis
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../bun.lock:/app/bun.lock:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../turbo.json:/app/turbo.json:ro
      - ../../apps/APIs:/app/apps/APIs
      - ../../packages/DB:/app/packages/DB
      - ../../packages/contracts:/app/packages/contracts
      - ../../packages/auth:/app/packages/auth
      - bun_install_cache:/root/.bun/install/cache
      - docker_cache:/app/.docker-cache
    depends_on:
      database:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    networks:
      - slide-sage-network

  web:
    build:
      context: ../..
      dockerfile: docker/dev/frontend.Dockerfile
      target: development
      args:
        NODE_ENV: development
    image: slide-sage/web:dev
    container_name: slide-sage-web-dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: "no"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      VITE_PROXY_TARGET: "http://apis:8000"
      ROOT_DIR: /app
      BUN_CACHE_DIR: /root/.bun/install/cache
      STAMP_DIR: /app/.docker-cache/web
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../bun.lock:/app/bun.lock:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../turbo.json:/app/turbo.json:ro
      - ../../apps/Web:/app/apps/Web
      - ../../packages/contracts:/app/packages/contracts
      - bun_install_cache:/root/.bun/install/cache
      - docker_cache:/app/.docker-cache
    depends_on:
      apis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - slide-sage-network

networks:
  slide-sage-network:
    driver: bridge

volumes:
  postgres_data:
  bun_install_cache:
  docker_cache:
