# Production Docker Compose

services:
  litellm:
    build:
      context: ../..
      dockerfile: docker/dev/litellm.Dockerfile
    image: slide-sage/litellm:prod
    container_name: slide-sage-litellm-prod
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../../litellm_config.yaml:/app/litellm_config.yaml:ro
    restart: unless-stopped
    networks:
      - slide-sage-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database:
    image: pgvector/pgvector:pg17
    container_name: slide-sage-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slidesage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidesage}
      POSTGRES_DB: ${POSTGRES_DB:-slidesage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-slidesage} -d ${POSTGRES_DB:-slidesage}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slide-sage-network

  apis:
    build:
      context: ../..
      dockerfile: docker/prod/backend.Dockerfile
      target: production
      args:
        NODE_ENV: production
    image: slide-sage/apis:prod
    container_name: slide-sage-apis-prod
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-slidesage}:${POSTGRES_PASSWORD:-slidesage}@database:5432/${POSTGRES_DB:-slidesage}
      LITELLM_PROXY_BASE: http://litellm:4000
      LITELLM_SEARCH_MODEL: ${LITELLM_SEARCH_MODEL:-llama-3.1-8b-instant}
      ROOT_DIR: /app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    networks:
      - slide-sage-network

  web:
    build:
      context: ../..
      dockerfile: docker/prod/frontend.Dockerfile
      target: production
      args:
        NODE_ENV: production
        VITE_API_URL: ${VITE_API_URL:-}
    image: slide-sage/web:prod
    container_name: slide-sage-web-prod
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-}
      ROOT_DIR: /app
    restart: unless-stopped
    depends_on:
      apis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - slide-sage-network

  nginx:
    image: nginx:1.27-alpine
    container_name: slide-sage-nginx-prod
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      apis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - slide-sage-network

networks:
  slide-sage-network:
    driver: bridge

volumes:
  postgres_data:
