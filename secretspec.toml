EMBEDDING_MODEL = { description = "OpenRouter embedding model identifier", required = true }
EXA_API_KEY = { description = "Exa API key", required = true }
GITHUB_CLIENT_ID = { description = "GitHub OAuth client ID", required = true }
GITHUB_CLIENT_SECRET = { description = "GitHub OAuth client secret", required = true }
GOOGLE_CLIENT_ID = { description = "Google OAuth client ID", required = true }
