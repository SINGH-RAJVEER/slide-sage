[project]
name = "slidesage"
revision = "1.0"

[profiles.default]
AUTH_SECRET = { description = "Better Auth signing secret", required = true }
BASE_URL = { description = "Public API and auth callback origin", required = true }
BETTER_AUTH_TRUSTED_ORIGINS = { description = "Allowed Better Auth browser origins", required = true }
BYOK_ENCRYPTION_KEY_V1 = { description = "Base64-encoded 32-byte BYOK AES-GCM key", required = true }
CLOUDFLARE_API_TOKEN = { description = "Cloudflare deployment token", required = true }
CORS_ORIGINS = { description = "Allowed credentialed browser origins", required = true }
DATABASE_CONNECT_TIMEOUT = { description = "PostgreSQL connection timeout in seconds" }
